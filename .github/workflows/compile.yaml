name: Compiles only

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    name: Calcit paired toolchain validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn --version

      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
          deps-file: deps.cirru

      - name: Install dependencies
        run: |
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain

      - name: Check native and JavaScript builds
        run: |
          set -euo pipefail
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit fix --workflow strict --verify --format json | jq -e 'if .data.workflow.status == "passed" and .diagnostics == [] then true else ., false end'
          calcit calcit.cirru --check-only --ns cumulo-util.activity --ns cumulo-util.core --ns cumulo-util.client --summary-only
          calcit calcit.cirru --entry server --check-only --ns cumulo-util.app --ns cumulo-util.file --ns cumulo-util.realtime --summary-only
          calcit calcit.cirru analyze weak-types --only coverage --summary-only
          calcit calcit.cirru analyze weak-types --only deprecated-call
          calcit docs check-md README.md --dep ./ --failures-only
          calcit calcit.cirru --entry server js
          yarn test
          yarn build

      - name: Check out the 0.30-line WS-EDN consumer
        uses: actions/checkout@v7.0.1
        with:
          repository: mvc-works/ws-edn.calcit
          ref: 0.0.47
          path: .calcit/ws-edn-consumer
          persist-credentials: false

      - name: Check original WS-EDN source against this Util
        working-directory: .calcit/ws-edn-consumer
        run: |
          set -euo pipefail
          # Source compatibility fixture, not the consumer's original npm graph.
          # Reuse the producer's verified host pair; keep both entry targets.
          git rev-parse HEAD
          cp "$GITHUB_WORKSPACE/deps.cirru" "$GITHUB_WORKSPACE/package.json" "$GITHUB_WORKSPACE/yarn.lock" .
          ln -s "$GITHUB_WORKSPACE/node_modules" node_modules
          mkdir -p .calcit/modules
          ln -s "$GITHUB_WORKSPACE/.calcit/modules/js-ffi" .calcit/modules/js-ffi
          ln -s "$GITHUB_WORKSPACE" .calcit/modules/cumulo-util.calcit
          # Normalize only type notation in this isolated legacy source fixture.
          calcit edit format
          git add -- calcit.cirru
          calcit --check-only --ns ws-edn.client --ns ws-edn.schema --ns ws-edn.util --ns ws-edn.app.page --summary-only --format json
          calcit --entry server --check-only --ns ws-edn.server --ns ws-edn.schema --ns ws-edn.util --ns ws-edn.app.server --summary-only --format json
          calcit fix --workflow strict --verify --format json | jq -e 'if .data.workflow.status == "passed" and .diagnostics == [] then true else ., false end'
          calcit test --tag unit --require-match --summary-only --format json
          calcit --emit-path out-page/ js
          calcit --entry server js
          git diff --quiet -- . ':!deps.cirru' ':!package.json' ':!yarn.lock'

      - name: 保存已验证的构建
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: util-builds
          path: |
            dist/
            js-out/
          if-no-files-found: error
          retention-days: 7
